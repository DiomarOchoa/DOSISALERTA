# Configuracion de Alembic para DosisAlerta (Fase 2).
#
# La URL de conexion NO se guarda aqui: `alembic/env.py` la toma de
# la configuracion central (`app.core.config`, que lee `.env`).
# Este archivo solo dice donde estan los scripts de migracion.
# `%(here)s` es el directorio de este archivo, asi la ubicacion de
# los scripts no depende del directorio de trabajo: funciona desde
# `backend/` y tambien con `alembic -c backend/alembic.ini ...`
# desde la raiz del repositorio (correccion de la auditoria del
# bot, 2026-11-11: antes era una ruta relativa que solo funcionaba
# desde `backend/`). Uso habitual, desde la carpeta `backend/`:
#   alembic revision --autogenerate -m "..."
#   alembic upgrade head

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
