# DosisAlerta — docker-compose.yml (Fase B, entorno de 4 PCs)
#
# Alcance: este archivo define UNICAMENTE el entorno de desarrollo
# local (PostgreSQL). El backend FastAPI y el frontend React NO se
# levantan aqui: se ejecutan fuera de Docker, con uvicorn y con
# npm run dev, para que depurarlos sea sencillo.
#
# Imagen fijada en la Fase A: postgres:17.11-alpine, verificada en
# Docker Hub y en el PC del equipo el 2026-11-11 (PostgreSQL 17.11
# en el contenedor dosisalerta-postgres). No cambiar la imagen sin
# una version aprobada y justificada.
#
# Uso:
#   cp .env.example .env   # y completar valores
#   docker compose up -d postgres
#   docker compose ps
#   docker compose down    # detener sin borrar datos
#
# NUNCA ejecutar `docker compose down -v`: borra el volumen
# postgres-data y todos los datos de desarrollo.
#
# Puerto del host: POSTGRES_PORT en .env (5432 por defecto). En el
# PC del equipo es 5433 porque el 5432 lo ocupa un PostgreSQL 18
# nativo; en cada PC se comprueba antes cual esta libre (ver
# docker/README.md) y se pone ese valor en .env, sin tocar este
# archivo. El puerto dentro del contenedor siempre es 5432.

services:
  postgres:
    image: postgres:17.11-alpine
    container_name: dosisalerta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dosisalerta}
      POSTGRES_USER: ${POSTGRES_USER:-dosisalerta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
    # Puerto configurable: el primer numero es el puerto del host
    # (POSTGRES_PORT en .env, 5432 por defecto) y el segundo es el
    # puerto dentro del contenedor, que siempre es 5432. Asi, si el
    # 5432 ya esta ocupado en el PC, basta cambiar POSTGRES_PORT
    # en .env sin tocar este archivo.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dosisalerta} -d ${POSTGRES_DB:-dosisalerta}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
